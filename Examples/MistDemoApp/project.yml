name: MistDemoApp

options:
  bundleIdPrefix: com.brightdigit
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: MistDemoApp
    PRODUCT_BUNDLE_IDENTIFIER: com.brightdigit.MistDemoApp
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "MistDemo (Native)"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: MistDemoApp.entitlements
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MistDemoApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/MistDemoApp
        type: group
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 BrightDigit. All rights reserved."
        ENABLE_HARDENED_RUNTIME: "YES"

  MistDemoApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/MistDemoApp
        type: group
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

schemes:
  MistDemoApp-macOS:
    build:
      targets:
        MistDemoApp-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  MistDemoApp-iOS:
    build:
      targets:
        MistDemoApp-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
