name: BushelCloud
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: BushelCloud
  MISTKIT_BRANCH: v1.0.0-beta.4

jobs:
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.check.outputs.full }}
      ubuntu-os: ${{ steps.matrix.outputs.ubuntu-os }}
      ubuntu-swift: ${{ steps.matrix.outputs.ubuntu-swift }}
    steps:
      - id: check
        name: Determine matrix scope
        run: |
          FULL=false
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          BASE_REF="${{ github.base_ref }}"

          # Full matrix on main
          if [[ "$REF" == "refs/heads/main" ]]; then
            FULL=true
          # Full matrix on semver branches (v1.0.0, 1.2.3-alpha.1, etc.)
          elif [[ "$REF" =~ ^refs/heads/v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            FULL=true
          # Full matrix on PRs targeting main or semver branches
          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              FULL=true
            fi
          fi

          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Full matrix: $FULL (ref=$REF, event=$EVENT, base_ref=$BASE_REF)"

      - id: matrix
        name: Build matrix values
        run: |
          # BushelCloud's Package.swift declares swift-tools-version: 6.4.
          # Swift 6.4 has no release toolchain yet, so the nightly image is the
          # only Linux toolchain that can parse the manifest — no 6.2/6.3 lanes.
          SWIFT='[{"version":"6.4","image":"swiftlang/swift:nightly-6.4.x"}]'
          if [[ "${{ steps.check.outputs.full }}" == "true" ]]; then
            echo 'ubuntu-os=["noble","jammy"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ubuntu-os=["noble"]' >> "$GITHUB_OUTPUT"
          fi
          echo "ubuntu-swift=$SWIFT" >> "$GITHUB_OUTPUT"

  build-ubuntu:
    name: Build on Ubuntu
    needs: configure
    runs-on: ubuntu-latest
    # The `||` branch (a plain swift:<version>-<os> image) is unreachable while
    # the matrix emits only the 6.4 nightly entry, which always sets `image`.
    # Kept deliberately: it is what a release-toolchain lane would use once
    # Swift 6.4 ships and can be added back to the matrix.
    container: ${{ matrix.swift.image && format('{0}-{1}', matrix.swift.image, matrix.os) || format('swift:{0}-{1}', matrix.swift.version, matrix.os) }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.ubuntu-os) }}
        swift: ${{ fromJSON(needs.configure.outputs.ubuntu-swift) }}

    steps:
      - uses: actions/checkout@v6
      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - uses: brightdigit/swift-build@v1
        id: build
        with:
          skip-package-resolved: true
      - name: Install curl (required by Codecov uploader)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          fi
      - uses: sersoft-gmbh/swift-coverage-action@v5
        if: steps.build.outputs.contains-code-coverage == 'true'
        id: coverage-files
        with:
          fail-on-empty-output: true
          minimum-coverage: 70
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: swift-${{ matrix.swift.version }}-${{ matrix.os }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  # build-windows:
  #   name: Build on Windows
  #   needs: configure
  #   runs-on: ${{ matrix.runs-on }}
  #   if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       runs-on: [windows-2022, windows-2025]
  #       swift:
  #         - version: swift-6.2-release
  #           build: 6.2-RELEASE
  #         - version: swift-6.3-release
  #           build: 6.3-RELEASE
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: brightdigit/swift-build@v1
  #       id: build
  #       with:
  #         windows-swift-version: ${{ matrix.swift.version }}
  #         windows-swift-build: ${{ matrix.swift.build }}
  #         skip-package-resolved: true
  #     - name: Upload coverage to Codecov
  #       if: steps.build.outputs.contains-code-coverage == 'true'
  #       uses: codecov/codecov-action@v6
  #       with:
  #         fail_ci_if_error: true
  #         flags: swift-${{ matrix.swift.version }},windows
  #         verbose: true
  #         token: ${{ secrets.CODECOV_TOKEN }}
  #         os: windows
  #         swift_project: BushelCloud-Package

  # Minimal macOS builds — always runs (SPM + iOS)
  build-macos:
    name: Build on macOS
    runs-on: ${{ matrix.runs-on }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A swift-tools-version: 6.4 manifest needs a Swift 6.4 toolchain, so
          # these lanes run on the xcode-27 image (Xcode 27.0) rather than
          # macos-26 / Xcode 26.6, which cannot parse the manifest.
          # SPM build
          - runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"

          # iOS build
          - type: ios
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "27.0"
            download-platform: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          scheme: ${{ env.PACKAGE_NAME }}-Package
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          skip-package-resolved: true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          minimum-coverage: 70
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('{0}{1}', matrix.type, matrix.osVersion) || 'spm' }}

  # Full macOS platform builds — only on main, semver branches, and PRs targeting them
  build-macos-platforms:
    name: Build on macOS (Platforms)
    needs: configure
    runs-on: ${{ matrix.runs-on }}
    if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Xcode 27 (preview image, beta toolchain) ─────────────────────
          # A swift-tools-version: 6.4 manifest needs a Swift 6.4 toolchain, so
          # every Apple lane runs here; the macos-26 / Xcode 26.6 lanes cannot
          # parse the manifest and are gone.
          #
          # `runs-on: xcode-27` is its own image label, not a macos-NN one, and
          # is marked Preview in actions/runner-images. It ships exactly one
          # Xcode — 27.0 beta — so there is no 26.x fallback on this runner.
          #
          # Pin the /Applications/Xcode_27.0.app symlink, NOT the real
          # Xcode_27_beta_4.app path: the beta number changes on every image
          # refresh and would silently break these lanes.
          #
          # tvOS uses "Apple TV 4K (3rd generation)" — this image has no plain
          # "Apple TV" device. A wrong device name fails the simulator boot
          # outright.
          - type: macos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"

          - type: ios
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "27.0"
            download-platform: true

          - type: watchos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "27.0"
            download-platform: true

          - type: tvos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple TV 4K (3rd generation)"
            osVersion: "27.0"
            download-platform: true

          - type: visionos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple Vision Pro"
            osVersion: "27.0"
            download-platform: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          scheme: ${{ env.PACKAGE_NAME }}-Package
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          skip-package-resolved: true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          minimum-coverage: 70
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('{0}{1}', matrix.type, matrix.osVersion) || 'spm' }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && !contains(github.event.head_commit.message, 'ci skip') }}
    needs: [build-ubuntu, build-macos, build-macos-platforms]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Lint
        run: |
          set -e
          ./Scripts/lint.sh
