name: BushelCloud
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: BushelCloud
  MISTKIT_BRANCH: v1.0.0-beta.2
  CONFIGKEYKIT_BRANCH: main

jobs:
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.check.outputs.full }}
      ubuntu-os: ${{ steps.matrix.outputs.ubuntu-os }}
      ubuntu-swift: ${{ steps.matrix.outputs.ubuntu-swift }}
    steps:
      - id: check
        name: Determine matrix scope
        run: |
          FULL=false
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          BASE_REF="${{ github.base_ref }}"

          # Full matrix on main
          if [[ "$REF" == "refs/heads/main" ]]; then
            FULL=true
          # Full matrix on semver branches (v1.0.0, 1.2.3-alpha.1, etc.)
          elif [[ "$REF" =~ ^refs/heads/v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            FULL=true
          # Full matrix on PRs targeting main or semver branches
          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              FULL=true
            fi
          fi

          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Full matrix: $FULL (ref=$REF, event=$EVENT, base_ref=$BASE_REF)"

      - id: matrix
        name: Build matrix values
        run: |
          # BushelCloud's Package.swift declares swift-tools-version: 6.2,
          # so Swift 6.1 is not supported.
          if [[ "${{ steps.check.outputs.full }}" == "true" ]]; then
            echo 'ubuntu-os=["noble","jammy"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-swift=["6.2","6.3"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ubuntu-os=["noble"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-swift=["6.3"]' >> "$GITHUB_OUTPUT"
          fi

  build-ubuntu:
    name: Build on Ubuntu
    needs: configure
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.ubuntu-os) }}
        swift: ${{ fromJSON(needs.configure.outputs.ubuntu-swift) }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - name: Setup ConfigKeyKit
        uses: brightdigit/ConfigKeyKit/.github/actions/setup-configkeykit@main
        with:
          branch: ${{ env.CONFIGKEYKIT_BRANCH }}

      - uses: brightdigit/swift-build@v1
        id: build
        with:
          skip-package-resolved: true
      - name: Install curl (required by Codecov uploader)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          fi
      - uses: sersoft-gmbh/swift-coverage-action@v5
        if: steps.build.outputs.contains-code-coverage == 'true'
        id: coverage-files
        with:
          fail-on-empty-output: true
          minimum-coverage: 70
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: swift-${{ matrix.swift }}-${{ matrix.os }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  # build-windows:
