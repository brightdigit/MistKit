  # Minimal macOS builds — always runs (SPM + iOS)
  build-macos:
    name: Build on macOS
    runs-on: macos-26
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPM build
          - xcode: "/Applications/Xcode_26.4.app"

          # iOS build
          - type: ios
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "26.4.1"
            download-platform: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - name: Setup ConfigKeyKit
        uses: brightdigit/ConfigKeyKit/.github/actions/setup-configkeykit@main
        with:
          branch: ${{ env.CONFIGKEYKIT_BRANCH }}

      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          scheme: ${{ env.PACKAGE_NAME }}-Package
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          skip-package-resolved: true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          minimum-coverage: 70
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('{0}{1}', matrix.type, matrix.osVersion) || 'spm' }}

  # Full macOS platform builds — only on main, semver branches, and PRs targeting them
  build-macos-platforms:
    name: Build on macOS (Platforms)
    needs: configure
    runs-on: macos-26
    if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - type: macos
            xcode: "/Applications/Xcode_26.4.app"

          # watchOS
          - type: watchos
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "26.4"
            download-platform: true

          # tvOS
          - type: tvos
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "Apple TV"
            osVersion: "26.4"
            download-platform: true

          # visionOS
          - type: visionos
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "Apple Vision Pro"
            osVersion: "26.4.1"
            download-platform: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup MistKit
        uses: brightdigit/MistKit/.github/actions/setup-mistkit@main
        with:
          branch: ${{ env.MISTKIT_BRANCH }}

      - name: Setup ConfigKeyKit
        uses: brightdigit/ConfigKeyKit/.github/actions/setup-configkeykit@main
        with:
          branch: ${{ env.CONFIGKEYKIT_BRANCH }}

      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          scheme: ${{ env.PACKAGE_NAME }}-Package
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          skip-package-resolved: true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          minimum-coverage: 70
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('{0}{1}', matrix.type, matrix.osVersion) || 'spm' }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && !contains(github.event.head_commit.message, 'ci skip') }}
    needs: [build-ubuntu, build-macos, build-macos-platforms]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Lint
        run: |
          set -e
          ./Scripts/lint.sh
