name: MistDemoApp

options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MistDemo:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.4"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: MistDemoApp
    # Distinct from the SPM library product `MistDemoApp` so their
    # swiftmodules don't collide in the build directory.
    PRODUCT_MODULE_NAME: MistDemoAppShell
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.MistDemoApp
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "MistDemo (Native)"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: MistDemoApp.entitlements
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MistDemoApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        type: group
    dependencies:
      - package: MistDemo
        product: MistDemoApp
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 BrightDigit. All rights reserved."
        ENABLE_HARDENED_RUNTIME: "YES"

  MistDemoApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        type: group
    dependencies:
      - package: MistDemo
        product: MistDemoApp
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

schemes:
  MistDemoApp-macOS:
    build:
      targets:
        MistDemoApp-macOS: all
    run:
      config: Debug
      environmentVariables:
        CLOUDKIT_API_TOKEN: ${CLOUDKIT_API_TOKEN}
    test:
      config: Debug
    archive:
      config: Release

  MistDemoApp-iOS:
    build:
      targets:
        MistDemoApp-iOS: all
    run:
      config: Debug
      environmentVariables:
        CLOUDKIT_API_TOKEN: ${CLOUDKIT_API_TOKEN}
    test:
      config: Debug
    archive:
      config: Release
