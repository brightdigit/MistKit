# MistDemo Integration Runs
#
# Live end-to-end runs against the real CloudKit container
# (iCloud.com.brightdigit.MistDemo). Triggered on push to main and
# release branches, and via manual workflow_dispatch (used to re-run
# after rotating CLOUDKIT_WEB_AUTH_TOKEN).
#
# Required repo secrets:
#   CLOUDKIT_API_TOKEN          - Web Services API token
#   CLOUDKIT_WEB_AUTH_TOKEN     - Web-auth token (rotate when stale; manual)
#   CLOUDKIT_KEY_ID             - Server-to-server key ID
#   CLOUDKIT_PRIVATE_KEY_BASE64 - Server-to-server PEM, base64-encoded
#                                 (base64 -w0 key.pem)
#   CLOUDKIT_CONTAINER_ID       - iCloud.com.brightdigit.MistDemo
#
# Two-job design:
#   1) `build` runs in `swift:6.3-noble` and produces the mistdemo
#      binary plus the Swift runtime libs it needs at run time
#      (libswiftCore, libdispatch, libFoundation, ...).
#   2) `integration` runs on plain `ubuntu-24.04` (matching the
#      container's glibc), downloads the bundle, and executes the live
#      CloudKit phases with LD_LIBRARY_PATH set to the bundled libs.
#      No Swift toolchain on the run host.
#
# Secrets are NOT exposed to fork pull requests — there is no
# pull_request trigger on this workflow by design.

name: MistDemo Integration

on:
  push:
    branches:
      - main
      - 'v*.*.*'
      # TEMPORARY: remove before merge — lets us iterate on this workflow
      # in real CI without merging to main first.
      - claude/plan-issue-325-aQGRH
  workflow_dispatch:

concurrency:
  group: mistdemo-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mistdemo bundle
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: swift build
        working-directory: Examples/MistDemo
        run: swift build

      - name: Bundle binary + Swift runtime
        run: |
          set -euo pipefail
          mkdir -p bundle/lib
          cp Examples/MistDemo/.build/debug/mistdemo bundle/mistdemo
          # Swift runtime: libswiftCore, libdispatch, libFoundation*,
          # libBlocksRuntime, libswift_Concurrency, ...
          cp -a /usr/lib/swift/linux/. bundle/lib/
          # System libs whose ABI is tied to the build image. ubuntu-24.04
          # (noble) ships matching versions, but bundling avoids drift if
          # the runner image changes minor versions.
          for so in libcurl libxml2 libssl libcrypto; do
            for path in /usr/lib/x86_64-linux-gnu/${so}*.so*; do
              [ -e "$path" ] && cp -a "$path" bundle/lib/
            done
          done
          tar czf mistdemo-bundle.tar.gz -C bundle .
          ls -lh mistdemo-bundle.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mistdemo-bundle
          path: mistdemo-bundle.tar.gz
          retention-days: 1
          # tarball is already gzipped — skip the action's redundant zip.
          compression-level: 0

  integration:
    name: Live CloudKit Integration
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/bundle/lib
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mistdemo-bundle

      - name: Extract bundle
        run: |
          set -euo pipefail
          mkdir -p bundle integration-logs
          tar xzf mistdemo-bundle.tar.gz -C bundle
          chmod +x bundle/mistdemo
          # Smoke check: does the binary even start? --help has no network
          # or auth dependencies, so failure here means we mis-bundled libs.
          ./bundle/mistdemo --help >/dev/null

      - name: Decode server-to-server private key
        env:
          CLOUDKIT_PRIVATE_KEY_BASE64: ${{ secrets.CLOUDKIT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/cloudkit_s2s.pem"
          printf '%s' "$CLOUDKIT_PRIVATE_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Defensive: mask the decoded PEM line-by-line so it can never
          # land in step logs.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < "$KEY_PATH"
          echo "CLOUDKIT_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: test-public
        timeout-minutes: 10
        env:
          CLOUDKIT_API_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
          CLOUDKIT_ENVIRONMENT: development
        run: |
          set -o pipefail
          ./bundle/mistdemo test-public \
            --record-count 5 \
            --asset-size 50 \
            2>&1 | tee integration-logs/test-public.log

      - name: test-private
        timeout-minutes: 10
        env:
          CLOUDKIT_API_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
          CLOUDKIT_WEB_AUTH_TOKEN: ${{ secrets.CLOUDKIT_WEB_AUTH_TOKEN }}
          CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
          CLOUDKIT_ENVIRONMENT: development
        run: |
          set -o pipefail
          ./bundle/mistdemo test-private \
            --record-count 5 \
            --asset-size 50 \
            2>&1 | tee integration-logs/test-private.log

      - name: demo-errors
        timeout-minutes: 10
        env:
          CLOUDKIT_API_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
          CLOUDKIT_WEB_AUTH_TOKEN: ${{ secrets.CLOUDKIT_WEB_AUTH_TOKEN }}
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
          CLOUDKIT_ENVIRONMENT: development
        run: |
          set -o pipefail
          ./bundle/mistdemo demo-errors --scenario all \
            2>&1 | tee integration-logs/demo-errors.log
          # demo-errors exits 0 by design — assert all scenarios actually
          # ran by checking for the per-scenario completion markers.
          for marker in "401" "404" "409"; do
            grep -q "$marker" integration-logs/demo-errors.log || {
              echo "::error::demo-errors did not exercise scenario $marker"
              exit 1
            }
          done

      - name: demo-in-filter
        timeout-minutes: 10
        env:
          CLOUDKIT_API_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
          CLOUDKIT_WEB_AUTH_TOKEN: ${{ secrets.CLOUDKIT_WEB_AUTH_TOKEN }}
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
          CLOUDKIT_ENVIRONMENT: development
        run: |
          set -o pipefail
          ./bundle/mistdemo demo-in-filter \
            2>&1 | tee integration-logs/demo-in-filter.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup decoded private key
        if: always()
        run: |
          if [ -n "${CLOUDKIT_PRIVATE_KEY_PATH:-}" ] && [ -f "$CLOUDKIT_PRIVATE_KEY_PATH" ]; then
            rm -f "$CLOUDKIT_PRIVATE_KEY_PATH"
          fi
