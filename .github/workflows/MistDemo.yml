name: MistDemo
on:
  push:
    branches:
      - main
    paths:
      - 'Examples/MistDemo/**'
      - 'Sources/MistKit/**'
      - 'Package.swift'
      - '.github/workflows/MistDemo.yml'
  pull_request:
    paths:
      - 'Examples/MistDemo/**'
      - 'Sources/MistKit/**'
      - 'Package.swift'
      - '.github/workflows/MistDemo.yml'

concurrency:
  group: mistdemo-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: MistDemo
  WORKING_DIR: Examples/MistDemo

jobs:
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.check.outputs.full }}
      ubuntu-os: ${{ steps.matrix.outputs.ubuntu-os }}
      ubuntu-swift: ${{ steps.matrix.outputs.ubuntu-swift }}
      ubuntu-type: ${{ steps.matrix.outputs.ubuntu-type }}
    steps:
      - id: check
        name: Determine matrix scope
        run: |
          FULL=false
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          BASE_REF="${{ github.base_ref }}"

          # Full matrix on main
          if [[ "$REF" == "refs/heads/main" ]]; then
            FULL=true
          # Full matrix on semver branches (v1.0.0, 1.2.3-alpha.1, etc.)
          elif [[ "$REF" =~ ^refs/heads/v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            FULL=true
          # Full matrix on PRs targeting main or semver branches
          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              FULL=true
            fi
          fi

          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Full matrix: $FULL (ref=$REF, event=$EVENT, base_ref=$BASE_REF)"

      - id: matrix
        name: Build matrix values
        run: |
          # MistDemo's Package.swift declares swift-tools-version: 6.2,
          # so Swift 6.1 is not supported.
          if [[ "${{ steps.check.outputs.full }}" == "true" ]]; then
            echo 'ubuntu-os=["noble","jammy"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-swift=[{"version":"6.2"},{"version":"6.3"},{"version":"6.4","image":"swiftlang/swift:nightly-6.4.x"}]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-type=["","wasm","wasm-embedded"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ubuntu-os=["noble"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-swift=[{"version":"6.3"}]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu-type=[""]' >> "$GITHUB_OUTPUT"
          fi

  build-ubuntu:
    name: Build on Ubuntu
    needs: configure
    runs-on: ubuntu-latest
    container: ${{ matrix.swift.image && format('{0}-{1}', matrix.swift.image, matrix.os) || format('swift:{0}-{1}', matrix.swift.version, matrix.os) }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.ubuntu-os) }}
        swift: ${{ fromJSON(needs.configure.outputs.ubuntu-swift) }}
        type: ${{ fromJSON(needs.configure.outputs.ubuntu-type) }}
        exclude:
          # Swift nightly publishes no matching Wasm SDK snapshot, so the 6.4
          # entry builds SPM only.
          - swift: { version: "6.4", image: "swiftlang/swift:nightly-6.4.x" }
            type: "wasm"
          - swift: { version: "6.4", image: "swiftlang/swift:nightly-6.4.x" }
            type: "wasm-embedded"
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build
        with:
          type: ${{ matrix.type }}
          wasmtime-version: "40.0.2"
          wasm-swift-flags: >-
            -Xswiftc -disable-batch-mode
            -Xcc -D_WASI_EMULATED_SIGNAL
            -Xcc -D_WASI_EMULATED_MMAN
            -Xlinker -lwasi-emulated-signal
            -Xlinker -lwasi-emulated-mman
          working-directory: ${{ env.WORKING_DIR }}
      - name: Install curl (required by Codecov uploader)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          fi
      - name: Install coverage.py (silences codecov-cli probe warning)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: pip3 install --quiet --user coverage 2>/dev/null || true
      - uses: sersoft-gmbh/swift-coverage-action@v5
        if: steps.build.outputs.contains-code-coverage == 'true'
        id: coverage-files
        with:
          fail-on-empty-output: true
          search-paths: ${{ env.WORKING_DIR }}/.build
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: mistdemo-swift-${{ matrix.swift.version }}-${{ matrix.os }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  build-windows:
    name: Build on Windows
    needs: configure
    runs-on: ${{ matrix.runs-on }}
    if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2022, windows-2025]
        # MistDemo's Package.swift declares swift-tools-version: 6.2,
        # so Swift 6.1 is not supported.
        # TODO: re-add swift-6.2-release once the swift-testing 6.2 +
        # Windows parallel-runner crash is resolved (test process exits
        # 1 with no diagnostic output after fanning out parallel tests;
        # 6.3 is unaffected).
        swift:
          - version: swift-6.3-release
            build: 6.3-RELEASE
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build
        with:
          windows-swift-version: ${{ matrix.swift.version }}
          windows-swift-build: ${{ matrix.swift.build }}
          working-directory: ${{ env.WORKING_DIR }}
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: mistdemo-swift-${{ matrix.swift.version }},windows
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          os: windows
          swift_project: MistDemo

  build-android:
    name: Build on Android
    needs: configure
    runs-on: ubuntu-latest
    if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        # MistDemo's Package.swift declares swift-tools-version: 6.2,
        # so Swift 6.1 is not supported.
        swift:
          - version: "6.2"
          - version: "6.3"
        android-api-level: [33, 34]
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: brightdigit/swift-build@v1
        with:
          type: android
          android-swift-version: ${{ matrix.swift.version }}
          android-api-level: ${{ matrix.android-api-level }}
          android-run-tests: true
          working-directory: ${{ env.WORKING_DIR }}
      # Note: Code coverage is not supported on Android builds
      # The Swift Android SDK does not include LLVM coverage tools (llvm-profdata, llvm-cov)

  # Minimal macOS builds — always runs (SPM + iOS)
  build-macos:
    name: Build on macOS
    runs-on: macos-26
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    # Forward CI=true into the iOS simulator's test-runner process so
    # `TestPlatform.isFlakyTimeoutSimulator` tolerates the cooperative-executor
    # timeout flakes on the iOS sim. See the matching env on build-macos-platforms.
    env:
      TEST_RUNNER_CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPM build
          - xcode: "/Applications/Xcode_26.6.app"

          # iOS build
          - type: ios
            xcode: "/Applications/Xcode_26.6.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "26.5"
            download-platform: true
    steps:
      - uses: actions/checkout@v6
      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          working-directory: ${{ env.WORKING_DIR }}
      - name: Install coverage.py (silences codecov-cli probe warning)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: pip3 install --quiet --user coverage 2>/dev/null || true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          search-paths: ${{ env.WORKING_DIR }}/.build
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('mistdemo-{0}{1}', matrix.type, matrix.osVersion) || 'mistdemo-spm-macos' }}

  # Full macOS platform builds — only on main, semver branches, and PRs targeting them
  build-macos-platforms:
    name: Build on macOS (Platforms)
    needs: configure
    runs-on: ${{ matrix.runs-on }}
    if: ${{ needs.configure.outputs.full-matrix == 'true' && !contains(github.event.head_commit.message, 'ci skip') }}
    # Forward CI=true into the simulator's test-runner process. `xcodebuild
    # test` re-exports any host env var prefixed `TEST_RUNNER_` to the test
    # runner with the prefix stripped, so `TEST_RUNNER_CI` arrives as `CI`
    # inside the sim. An env dump (EnvironmentDiagnosticTests) confirmed the
    # earlier `SIMCTL_CHILD_CI` approach never reached the runner — those vars
    # only apply to `simctl spawn`/`launch`, not xctest — which is why the
    # cooperative-executor flake gates in #334 still surfaced as real failures.
    # With `CI` now visible, `TestPlatform.isFlakyTimeoutSimulator` tolerates
    # the iOS/watchOS/visionOS sim flakes instead.
    env:
      TEST_RUNNER_CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - type: macos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.6.app"

          # watchOS
          - type: watchos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.6.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "26.5"
            download-platform: true

          # tvOS
          - type: tvos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.6.app"
            deviceName: "Apple TV"
            osVersion: "26.5"
            download-platform: true

          # visionOS
          - type: visionos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.6.app"
            deviceName: "Apple Vision Pro"
            osVersion: "26.5"
            download-platform: true

          # ── Xcode 27 (preview image, beta toolchain) ─────────────────────
          # `runs-on: xcode-27` is its own image label, not a macos-NN one, and
          # is marked Preview in actions/runner-images. It ships exactly one
          # Xcode — 27.0 beta — so there is no 26.x fallback on this runner.
          #
          # Pin the /Applications/Xcode_27.0.app symlink, NOT the real
          # Xcode_27_beta_4.app path: the beta number changes on every image
          # refresh and would silently break these lanes.
          #
          # tvOS uses "Apple TV 4K (3rd generation)" — this image has no plain
          # "Apple TV" device, unlike macos-26 above. A wrong device name fails
          # the simulator boot outright.
          - type: macos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"

          - type: ios
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "27.0"
            download-platform: true

          - type: watchos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "27.0"
            download-platform: true

          - type: tvos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple TV 4K (3rd generation)"
            osVersion: "27.0"
            download-platform: true

          - type: visionos
            runs-on: xcode-27
            xcode: "/Applications/Xcode_27.0.app"
            deviceName: "Apple Vision Pro"
            osVersion: "27.0"
            download-platform: true
    steps:
      - uses: actions/checkout@v6
      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          working-directory: ${{ env.WORKING_DIR }}
      - name: Install coverage.py (silences codecov-cli probe warning)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: pip3 install --quiet --user coverage 2>/dev/null || true
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          search-paths: ${{ env.WORKING_DIR }}/.build
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('mistdemo-{0}{1}', matrix.type, matrix.osVersion) || 'mistdemo-spm-macos' }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && !contains(github.event.head_commit.message, 'ci skip') }}
    needs: [build-ubuntu, build-macos, build-macos-platforms, build-windows, build-android]
    # Shared with MistKit's lint job: serialize across workflows so a cold
    # cache on a mise.toml bump only triggers one rebuild, not a race.
    concurrency:
      group: lint-tools-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
      - name: Lint
        run: |
          set -e
          ./Scripts/lint.sh
