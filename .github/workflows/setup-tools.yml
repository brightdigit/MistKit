name: Setup Tools

# Reusable workflow that owns the mise tool cache lifecycle.
#
# Why this exists:
# - Both MistKit and MistDemo lint jobs depend on the same root mise.toml,
#   so they computed identical cache keys and raced each other on every
#   push. The loser hit "Failed to save: Unable to reserve cache with
#   key ..., another job may be creating this cache" and got nothing,
#   forcing a ~9 minute clean SPM rebuild of swift-format,
#   swift-openapi-generator, and periphery.
# - jdx/mise-action's built-in cache also lacked restore-keys, so any
#   mise.toml bump produced a clean rebuild instead of an incremental one.
#
# Strategy: a single job populates the cache on miss; consumers do
# read-only restores with fail-on-cache-miss so a broken hand-off fails
# loudly. restore-keys lets a version bump pull the previous tool tree
# and rebuild incrementally.

on:
  workflow_call:

# Serialize across callers (MistKit.yml + MistDemo.yml) so a cold-cache
# run after a mise.toml bump rebuilds tools once, not twice. The second
# caller waits, then hits the cache and skips install.
concurrency:
  group: setup-tools-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  setup-tools:
    name: Setup mise tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore mise tools cache
        id: mise-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise tools (cache miss)
        if: steps.mise-cache.outputs.cache-hit != 'true'
        uses: jdx/mise-action@v4
        with:
          cache: false
