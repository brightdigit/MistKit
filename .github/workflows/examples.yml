name: Examples

on:
  pull_request:
    # Match MistKit.yml full-matrix bases: main and semver release branches (e.g. v1.0.0-beta.5).
    branches:
      - main
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: MistKit

jobs:
  test-examples:
    name: Test ${{ matrix.example }} on Ubuntu
    runs-on: ubuntu-latest
    # BushelCloud / CelestraCloud / MistKitConfiguration declare swift-tools-version: 6.4;
    # MistDemo is 6.2 but needs a 6.4 toolchain to resolve MistKitConfiguration.
    # Swift 6.4 has no release image yet — use the nightly (same pin as the subrepos).
    container: ${{ matrix.container }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: MistDemo
            path: Examples/MistDemo
            container: swiftlang/swift:nightly-6.4.x-noble
          - example: BushelCloud
            path: Examples/BushelCloud
            container: swiftlang/swift:nightly-6.4.x-noble
          - example: CelestraCloud
            path: Examples/CelestraCloud
            container: swiftlang/swift:nightly-6.4.x-noble
          - example: MistKitConfiguration
            path: Packages/MistKitConfiguration
            container: swiftlang/swift:nightly-6.4.x-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and Test ${{ matrix.example }}
        uses: brightdigit/swift-build@v1
        with:
          working-directory: ${{ matrix.path }}
