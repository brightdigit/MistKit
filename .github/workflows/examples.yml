name: Examples

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: MistKit

jobs:
  test-examples:
    name: Test ${{ matrix.example }} on Ubuntu
    runs-on: ubuntu-latest
    # BushelCloud / CelestraCloud declare swift-tools-version: 6.4; MistDemo is 6.2.
    # Swift 6.4 has no release image yet — use the nightly (same pin as the subrepos).
    container: ${{ matrix.container }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: MistDemo
            container: swift:6.3
          - example: BushelCloud
            container: swiftlang/swift:nightly-6.4.x-noble
          - example: CelestraCloud
            container: swiftlang/swift:nightly-6.4.x-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and Test ${{ matrix.example }}
        uses: brightdigit/swift-build@v1
        with:
          working-directory: Examples/${{ matrix.example }}
